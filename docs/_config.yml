# Jekyll config for the legacy "Deploy from branch" Pages builder.
#
# docs/plans/** are internal engineering documents containing JSX/Liquid
# lookalikes ({{ ... }} in React snippets). Jekyll parses Liquid inside
# code fences and chokes on them (Liquid::SyntaxError, Aug 2026). They are
# working notes, not site content — keep them out of the build entirely.
#
# The real site lives in docs/site/ and is deployed by the 'website'
# mode of .github/workflows/release.yml (no Jekyll involved).
exclude:
  - plans
