name: CI

# Runs on every push and pull request. The release workflow is manual and
# only exercises the code when someone cuts a release, so without this a
# regression could sit on main until the next release attempt. `npm test`
# rebuilds via its pretest hook, and webext:lint reads the fresh dist/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint:ts

      - name: Test
        run: npm test

      - name: Lint extension manifest
        run: npm run webext:lint
